# Workers are now managed through the database
# Use the database import tool to populate workers:
# ./build/db-import-test (uses the workers that were previously defined here)
# Global configs
settings:
  debug: true
  service:
    image: node:22.19.0
    user: root
  sleep_duration: 5
  team_name: autoteam-debug-team
  database:
    type: sqlite
    dsn: "./autoteam-debug.db"
  flow:
    - name: debug_task
      type: debug
      args: []
      input: |
        You are a debug worker. This is a simple debug flow step.

        Current time: {{ .timestamp }}
        Worker ID: {{ .worker.id }}
        Worker Name: {{ .worker.name }}

        Please log this information and report "Debug task completed successfully"

# Control plane configuration
control_plane:
  enabled: true
  port: 9090

# Dashboard configuration
dashboard:
  enabled: true
  port: 8081
  api_url: "http://localhost:9090"
  title: "AutoTeam Dashboard (Debug)"

# Deployment runtime configuration
deployments:
  runtime: docker
  config:
    # Docker client configuration
    docker_host: "unix:///var/run/docker.sock"  # Custom Docker daemon socket
    docker_socket: "/var/run/docker.sock"       # Socket path for volume mounting
    api_version: ""                              # Use API version negotiation (default)
    timeout: 30                                  # Client timeout in seconds
    tls_verify: false                           # Enable TLS verification
    cert_path: ""                               # Path to TLS certificates
    default_image: "alpine:latest"              # Default container image

    # Docker network configuration
    network_name: "autoteam-debug-team-network" # Custom network name
