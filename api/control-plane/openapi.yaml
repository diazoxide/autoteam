openapi: 3.0.3
info:
  title: AutoTeam Control Plane API
  description: |
    HTTP API for managing and monitoring multiple AutoTeam workers.

    This API provides both CRUD operations for worker management and runtime monitoring capabilities.

    **CRUD Endpoints** (/workers/*): Manage worker configurations stored in the database.
    These endpoints are always available and work independently of worker container status.

    **Runtime Endpoints** (/workers/*/runtime/*): Monitor live worker containers and proxy
    requests to running worker APIs. These endpoints require active worker containers and
    return 502 errors when containers are not running.
  version: 1.0.0
  contact:
    name: AutoTeam
    url: https://github.com/your-org/auto-team
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:9090
    description: Local control plane server

tags:
  - name: workers
    description: Worker CRUD operations and settings management
  - name: health
    description: Control plane health check endpoints
  - name: runtime
    description: Runtime endpoints that require running worker containers
  - name: actions
    description: Worker lifecycle action endpoints

paths:
  /health:
    get:
      summary: Control plane health check
      description: Returns the health status of the control plane and aggregated worker health
      operationId: getHealth
      tags: [health]
      responses:
        '200':
          description: Control plane health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlPlaneHealthResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers:
    get:
      summary: List workers
      description: Returns list of all configured workers and their status
      operationId: getWorkers
      tags: [workers]
      responses:
        '200':
          description: List of workers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkersResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create worker
      description: Creates a new worker with the provided configuration
      operationId: createWorker
      tags: [workers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkerRequest'
      responses:
        '201':
          description: Worker created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Worker name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{worker_id}:
    get:
      summary: Get worker details
      description: Returns details about a specific worker
      operationId: getWorker
      tags: [workers]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update worker
      description: Updates an existing worker configuration
      operationId: updateWorker
      tags: [workers]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkerRequest'
      responses:
        '200':
          description: Worker updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Worker name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete worker
      description: Deletes a worker and stops it if running
      operationId: deleteWorker
      tags: [workers]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Worker deleted successfully
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{worker_id}/runtime:
    get:
      summary: Get worker runtime info
      description: Returns runtime information about a worker from the registry
      operationId: getWorkerRuntime
      tags: [workers]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker runtime information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerDetailsResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Runtime endpoints (require running worker containers)
  /workers/{worker_id}/runtime/health:
    get:
      summary: Worker runtime health check
      description: Proxy to worker's health endpoint (requires running container)
      operationId: getWorkerRuntimeHealth
      tags: [runtime]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Worker unreachable (container not running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{worker_id}/runtime/status:
    get:
      summary: Worker runtime status
      description: Proxy to worker's status endpoint (requires running container)
      operationId: getWorkerRuntimeStatus
      tags: [runtime]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Worker unreachable (container not running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{worker_id}/runtime/config:
    get:
      summary: Worker runtime configuration
      description: Proxy to worker's config endpoint (requires running container)
      operationId: getWorkerRuntimeConfig
      tags: [runtime]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Worker unreachable (container not running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{worker_id}/runtime/logs:
    get:
      summary: Worker runtime logs
      description: Proxy to worker's logs endpoint (requires running container)
      operationId: getWorkerRuntimeLogs
      tags: [runtime]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
        - name: role
          in: query
          description: Filter logs by role (collector, executor, both)
          required: false
          schema:
            type: string
            enum: [collector, executor, both]
        - name: limit
          in: query
          description: Maximum number of log files to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Worker logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Worker unreachable (container not running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{worker_id}/runtime/logs/{filename}:
    get:
      summary: Worker runtime log file
      description: Proxy to worker's log file endpoint (requires running container)
      operationId: getWorkerRuntimeLogFile
      tags: [runtime]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
        - name: filename
          in: path
          description: Log filename
          required: true
          schema:
            type: string
            pattern: '^[a-zA-Z0-9_.-]+\.log$'
        - name: tail
          in: query
          description: Number of last lines to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
      responses:
        '200':
          description: Log file content
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Worker or log file not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Worker unreachable (container not running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{worker_id}/runtime/flow:
    get:
      summary: Worker runtime flow execution state
      description: Proxy to worker's flow endpoint (requires running container)
      operationId: getWorkerRuntimeFlow
      tags: [runtime]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker flow execution state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Worker unreachable (container not running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{worker_id}/runtime/flow/steps:
    get:
      summary: Worker runtime flow steps
      description: Proxy to worker's flow steps endpoint with execution details (requires running container)
      operationId: getWorkerRuntimeFlowSteps
      tags: [runtime]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker flow steps with execution details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowStepsResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Worker unreachable (container not running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{worker_id}/runtime/metrics:
    get:
      summary: Worker runtime metrics
      description: Proxy to worker's metrics endpoint (requires running container)
      operationId: getWorkerRuntimeMetrics
      tags: [runtime]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Worker unreachable (container not running)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /openapi.yaml:
    get:
      summary: OpenAPI specification
      description: Returns the OpenAPI specification for this API
      operationId: getOpenAPISpec
      tags: [docs]
      responses:
        '200':
          description: OpenAPI specification
          content:
            application/x-yaml:
              schema:
                type: string

  /docs/:
    get:
      summary: API documentation
      description: Swagger UI for interactive API documentation
      operationId: getSwaggerUI
      tags: [docs]
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

  # Worker action endpoints
  /workers/{worker_id}/actions/deploy:
    post:
      summary: Deploy worker
      description: Deploy a specific worker container
      operationId: deployWorker
      tags: [actions]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker deployed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          description: Bad request (e.g., worker cannot be deployed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{worker_id}/actions/stop:
    post:
      summary: Stop worker
      description: Stop a specific worker container
      operationId: stopWorker
      tags: [actions]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker stopped successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{worker_id}/actions/restart:
    post:
      summary: Restart worker
      description: Restart a specific worker container
      operationId: restartWorker
      tags: [actions]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker restarted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{worker_id}/actions/pause:
    post:
      summary: Pause worker
      description: Pause a specific worker container
      operationId: pauseWorker
      tags: [actions]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker paused successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /workers/{worker_id}/actions/unpause:
    post:
      summary: Unpause worker
      description: Unpause a specific worker container
      operationId: unpauseWorker
      tags: [actions]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker unpaused successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # Worker settings endpoints
  /workers/{worker_id}/settings:
    get:
      summary: Get worker settings
      description: Returns detailed settings for a specific worker
      operationId: getWorkerSettings
      tags: [workers]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Worker settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSettingsResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update worker settings
      description: Updates settings for a specific worker
      operationId: updateWorkerSettings
      tags: [workers]
      parameters:
        - name: worker_id
          in: path
          description: Worker ID
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkerSettingsRequest'
      responses:
        '200':
          description: Worker settings updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkerSettingsResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # Control plane specific types
    ControlPlaneHealthResponse:
      type: object
      required:
        - status
        - timestamp
        - workers_health
      properties:
        status:
          type: string
          description: Overall control plane health status
          enum: [healthy, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
          description: Health check timestamp
        workers_health:
          type: object
          description: Health status of each configured worker
          additionalProperties:
            type: string
            enum: [healthy, unhealthy, unreachable]
        message:
          type: string
          description: Additional health information

    WorkersResponse:
      type: object
      required:
        - workers
        - total
        - timestamp
      properties:
        workers:
          type: array
          items:
            $ref: '#/components/schemas/WorkerResponse'
        total:
          type: integer
          description: Total number of configured workers
        timestamp:
          type: string
          format: date-time
          description: Response timestamp

    WorkerDetailsResponse:
      type: object
      required:
        - worker
        - timestamp
      properties:
        worker:
          $ref: '#/components/schemas/WorkerDetails'
        timestamp:
          type: string
          format: date-time
          description: Response timestamp

    WorkerDetails:
      type: object
      required:
        - id
        - url
        - status
      properties:
        id:
          type: string
          description: Worker ID from configuration
        url:
          type: string
          description: Worker API URL
        status:
          type: string
          description: Worker connectivity status
          enum: [reachable, unreachable, unknown]
        last_check:
          type: string
          format: date-time
          description: Last health check timestamp
        worker_info:
          $ref: '#/components/schemas/WorkerInfo'
          description: Worker information (if reachable)

    # Reused types from worker API (same as internal/types)
    HealthResponse:
      type: object
      x-go-type: types.HealthResponse
      x-go-type-import:
        path: autoteam/internal/types
      required:
        - status
        - timestamp
        - agent
      properties:
        status:
          type: string
          description: Overall health status
          enum: [healthy, unhealthy]
        timestamp:
          type: string
          format: date-time
          description: Health check timestamp
        agent:
          $ref: '#/components/schemas/WorkerInfo'
        checks:
          type: object
          description: Individual health check results
          additionalProperties:
            $ref: '#/components/schemas/HealthCheck'

    StatusResponse:
      type: object
      x-go-type: types.StatusResponse
      x-go-type-import:
        path: autoteam/internal/types
      required:
        - status
        - mode
        - timestamp
        - agent
      properties:
        status:
          type: string
          description: Current operational status
          enum: [idle, running, error]
        mode:
          type: string
          description: Current operational mode
          enum: [both]
        timestamp:
          type: string
          format: date-time
          description: Status timestamp
        agent:
          $ref: '#/components/schemas/WorkerInfo'
        uptime:
          type: string
          description: Worker uptime duration

    LogsResponse:
      type: object
      x-go-type: types.LogsResponse
      x-go-type-import:
        path: autoteam/internal/types
      required:
        - logs
        - total
        - timestamp
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogFile'
        total:
          type: integer
          description: Total number of log files
        timestamp:
          type: string
          format: date-time
          description: Response timestamp

    MetricsResponse:
      type: object
      x-go-type: types.MetricsResponse
      x-go-type-import:
        path: autoteam/internal/types
      required:
        - metrics
        - timestamp
      properties:
        metrics:
          $ref: '#/components/schemas/WorkerMetrics'
        timestamp:
          type: string
          format: date-time
          description: Response timestamp

    ConfigResponse:
      type: object
      x-go-type: types.ConfigResponse
      x-go-type-import:
        path: autoteam/internal/types
      required:
        - config
        - timestamp
      properties:
        config:
          $ref: '#/components/schemas/WorkerConfig'
        timestamp:
          type: string
          format: date-time
          description: Response timestamp

    FlowResponse:
      type: object
      x-go-type: types.FlowResponse
      x-go-type-import:
        path: autoteam/internal/types
      required:
        - flow
        - timestamp
      properties:
        flow:
          $ref: '#/components/schemas/FlowInfo'
        timestamp:
          type: string
          format: date-time
          description: Response timestamp

    FlowStepsResponse:
      type: object
      x-go-type: types.FlowStepsResponse
      x-go-type-import:
        path: autoteam/internal/types
      required:
        - steps
        - total
        - timestamp
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FlowStepInfo'
        total:
          type: integer
          description: Total number of flow steps
        timestamp:
          type: string
          format: date-time
          description: Response timestamp

    # Core types (reused from worker API)
    WorkerInfo:
      type: object
      x-go-type: types.WorkerInfo
      x-go-type-import:
        path: autoteam/internal/types
      required:
        - name
        - type
        - version
      properties:
        name:
          type: string
          description: Worker name
        type:
          type: string
          description: Worker type
        version:
          type: string
          description: Worker version
