name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.21', '1.22']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: make mod-tidy
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json
    
    - name: Build dashboard for tests
      run: make dashboard-ui
    
    - name: Run tests
      run: make test
    
    - name: Run tests with race detection
      run: make test-race
    
    - name: Run code quality checks
      run: make check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
    
    - name: Cache Go modules
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.22-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.22-
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: make mod-tidy
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json
    
    - name: Build dashboard for tests
      run: make dashboard-ui
    
    - name: Generate code
      run: make codegen
    
    - name: Run tests with coverage
      run: make test-coverage
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
    
    - name: Cache Go modules
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.22-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.22-
          ${{ runner.os }}-go-
    
    - name: Download dependencies
      run: make mod-tidy
    
    - name: Build current platform
      run: make build
    
    - name: Build all platforms (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: make build-all
    
    - name: Upload build artifacts (Linux only)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: build/
        retention-days: 7

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: dashboard/package-lock.json
    
    - name: Install dashboard dependencies
      run: |
        cd dashboard
        npm install
    
    - name: Lint dashboard
      run: |
        cd dashboard
        npm run lint
    
    - name: Type check dashboard
      run: |
        cd dashboard
        npm run type-check
    
    - name: Build dashboard
      run: |
        cd dashboard
        npm run build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, dashboard]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'
    
    - name: Download dependencies
      run: make mod-tidy
    
    - name: Build binary
      run: |
        make build
        # Build embedded binary with all components
        make build-embedded
    
    - name: Test binary installation
      run: |
        # Test binary works (should exist in build directory)
        if [ -f "./build/autoteam" ]; then
          echo "✓ Testing regular binary..."
          ./build/autoteam --version
          ./build/autoteam --help
        else
          echo "❌ Regular autoteam binary not found in ./build/"
          echo "Contents of build directory:"
          ls -la ./build/ || echo "No build directory"
          exit 1
        fi
    
    - name: Test configuration initialization
      run: |
        # Test init command (should use regular binary)
        if [ -f "./build/autoteam" ]; then
          echo "✓ Testing configuration initialization..."
          ./build/autoteam init
          test -f autoteam.yaml && echo "✓ autoteam.yaml created successfully"
        else
          echo "❌ Cannot test configuration - autoteam binary not found"
          exit 1
        fi
    
    - name: Test embedded binary architecture
      run: |
        # Test embedded binary works
        if [ -f "./build/autoteam-embedded" ]; then
          echo "✓ Testing embedded binary..."
          ./build/autoteam-embedded --version
          ./build/autoteam-embedded --help

          # Test configuration generation with embedded binaries
          echo "✓ Testing configuration generation with embedded binaries..."
          ./build/autoteam-embedded generate
        else
          echo "❌ Embedded autoteam binary not found in ./build/"
          echo "Contents of build directory:"
          ls -la ./build/ || echo "No build directory"
          exit 1
        fi

        # Check that control plane directory is created
        echo "Checking control plane directory..."
        test -d .autoteam/autoteam/control-plane || { echo "❌ Control plane directory missing"; exit 1; }
        echo "✓ Control plane directory exists"

        # Check that control plane config file is generated
        echo "Checking control plane config file..."
        test -f .autoteam/autoteam/control-plane/config.yaml || { echo "❌ Control plane config missing"; exit 1; }
        echo "✓ Control plane config exists"

        # Check that .autoteam/bin directory exists with extracted binaries
        echo "Checking .autoteam/bin directory..."
        test -d .autoteam/bin || { echo "❌ .autoteam/bin directory missing"; exit 1; }
        echo "✓ .autoteam/bin directory exists"

        # Check that binaries were extracted automatically
        echo "Checking extracted binaries..."
        extracted_binaries=$(ls .autoteam/bin/autoteam-*-linux-* 2>/dev/null | wc -l)
        if [ "$extracted_binaries" -gt 0 ]; then
          echo "✓ Found $extracted_binaries embedded binaries extracted"
          ls .autoteam/bin/autoteam-*-linux-* | head -5
        else
          echo "❌ No embedded binaries found in .autoteam/bin directory"
          echo "Contents of .autoteam/bin directory:"
          ls -la .autoteam/bin/ || echo "No .autoteam/bin directory"
          exit 1
        fi

        # Check for entrypoint script
        if test -f .autoteam/bin/entrypoint.sh; then
          echo "✓ Entrypoint script extracted"
        else
          echo "⚠️ Entrypoint script not found (may be embedded differently)"
        fi

        echo "✅ Embedded binary architecture test passed"